{% extends "dashboard/base.html" %}
{% block title %}Add Lab Test - Hamro Hospital{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item"><a href="/laboratory/catalog/">Lab Catalog</a></li><li class="breadcrumb-item active">Add Test</li>{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-6 col-lg-8">
    <div class="card card-lg">
        <div class="card-header"><h5 class="mb-0"><i class="fas fa-flask me-2"></i>Add Lab Test to Catalog</h5></div>
        <div class="card-body p-6">
            <form method="POST">{% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Code *</label><input type="text" class="form-control" name="code" required placeholder="e.g., CBC"/></div>
                    <div class="col-md-6"><label class="form-label">Test Name *</label><input type="text" class="form-control" name="name" required placeholder="e.g., Complete Blood Count"/></div>
                    <div class="col-md-6"><label class="form-label">Price (NPR) *</label><input type="number" class="form-control" name="price" required min="0" step="0.01"/></div>
                    <div class="col-md-6"><label class="form-label">Department</label>
                        <select class="form-select" name="department">{% for d in departments %}<option value="{{ d.pk }}">{{ d.name }}</option>{% endfor %}</select>
                    </div>
                </div>
                <div class="d-grid mt-4">
                    <button class="btn btn-primary" type="submit"><i class="fas fa-save me-1"></i>Save Lab Test</button>
                </div>
            </form>
        </div>
    </div>
    <div class="d-flex justify-content-center mt-3">
        <a href="/laboratory/catalog/" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Back to Catalog</a>
    </div>
</div></div>
{% endblock %}
