{% extends "dashboard/base.html" %}
{% block title %}Upload Record - Hamro Hospital{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item"><a href="/medical-records/">Medical Records</a></li><li class="breadcrumb-item active">Upload</li>{% endblock %}
{% block content %}
<div class="row mb-6 g-6">
    <div class="col-xl-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Upload Record — {{ patient.full_name }}</h4>
                <a href="/medical-records/patient/{{ patient.pk }}/" class="btn btn-white"><i class="ti ti-arrow-left me-1"></i>Back</a>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">{% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Department</label><input type="text" class="form-control" name="department"/></div>
                        <div class="col-md-6">
                            <label class="form-label">Record Type</label>
                            <select class="form-select" name="record_type">
                                <option value="doctor_note">Doctor Note</option>
                                <option value="nursing_note">Nursing Note</option>
                                <option value="lab_report">Lab Report</option>
                                <option value="radiology_report">Radiology Report</option>
                                <option value="pharmacy_record">Pharmacy Record</option>
                                <option value="uploaded_pdf">Uploaded PDF</option>
                                <option value="uploaded_scan">Uploaded Scan</option>
                                <option value="note">Note</option>
                            </select>
                        </div>
                        <div class="col-md-12"><label class="form-label">Title</label><input type="text" class="form-control" name="title" required/></div>
                        <div class="col-md-12"><label class="form-label">Summary</label><textarea class="form-control" name="summary" rows="3"></textarea></div>
                        <div class="col-md-12"><label class="form-label">File</label><input type="file" class="form-control" name="file"/></div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary"><i class="ti ti-upload me-1"></i>Upload</button>
                            <a href="/medical-records/patient/{{ patient.pk }}/" class="btn btn-white ms-2">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
