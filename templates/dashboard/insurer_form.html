{% extends "dashboard/base.html" %}
{% block title %}Add Insurer - Hamro Hospital{% endblock %}
{% block breadcrumb %}<li class="breadcrumb-item"><a href="/insurance/">Insurance</a></li><li class="breadcrumb-item active">Add Insurer</li>{% endblock %}
{% block content %}
<div class="row mb-6 g-6">
    <div class="col-xl-8">
        <div class="card">
            <div class="card-header"><h4 class="mb-0">Add Insurance Provider</h4></div>
            <div class="card-body">
                <form method="post" class="needs-validation" novalidate>{% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Name</label><input type="text" class="form-control" name="name" required/></div>
                        <div class="col-md-6"><label class="form-label">Code</label><input type="text" class="form-control" name="code" required/></div>
                        <div class="col-md-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="2"></textarea></div>
                        <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control" name="phone"/></div>
                        <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email"/></div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary"><i class="ti ti-check me-1"></i>Save</button>
                            <a href="/insurance/insurers/" class="btn btn-white ms-2">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
