<!DOCTYPE html><html lang="en" data-bs-theme="light" id="htmlRoot"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gallery - Hamro Hospital</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link href="/static/css/bootstrap.min.css" rel="stylesheet"/><link href="/static/css/all.min.css" rel="stylesheet"/><link href="/static/css/style.css" rel="stylesheet"/><link href="/static/css/aos.css" rel="stylesheet"/>
</head><body><div id="landing"><nav id="nbar"><div class="container"><div class="d-flex align-items-center justify-content-between w-100">
<a href="/" class="d-flex align-items-center gap-2" style="font-size:1.2rem;font-weight:700"><img src="/static/images/brand/logo/hamro-hospital-logo.jpg" alt="Hamro Hospital" style="height:36px;border-radius:8px"/><span style="font-weight:700;font-size:1.1rem">Hamro Hospital</span></a>
<div class="d-none d-lg-flex align-items-center gap-1 mx-auto"><a href="/" class="nav-link">Home</a><a href="/departments/" class="nav-link">Departments</a><a href="/doctors/" class="nav-link">Doctors</a><a href="/gallery/" class="nav-link active">Gallery</a><a href="/contact/" class="nav-link">Contact</a></div>
</div></div></nav>
<section style="padding:100px 0 60px"><div class="container"><div class="text-center mb-5"><h1 style="font-size:2.5rem;font-weight:700">Photo <span style="background:linear-gradient(135deg,#6C63FF,#8B5CF6);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Gallery</span></h1></div>
<div class="row g-3">{% for img in images %}<div class="col-md-4 col-sm-6">
{% if img.image %}
<img src="{{ img.image.url }}" alt="{{ img.title }}" style="width:100%;height:250px;object-fit:cover;border-radius:16px"/>
{% else %}
<div style="width:100%;height:250px;border-radius:16px;background:linear-gradient(135deg,#6C63FF,#8B5CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;font-weight:600">
<i class="fa-solid fa-hospital" style="font-size:3rem;opacity:.3;margin-bottom:8px;display:block"></i><br>{{ img.title }}
</div>
{% endif %}
</div>{% endfor %}
{% if not images %}
<div class="col-md-4"><img src="/static/images/nexusai/about1.jpg" alt="Hospital" style="width:100%;height:250px;object-fit:cover;border-radius:16px"/></div>
<div class="col-md-4"><img src="/static/images/nexusai/about2.jpg" alt="Hospital" style="width:100%;height:250px;object-fit:cover;border-radius:16px"/></div>
<div class="col-md-4"><img src="/static/images/nexusai/banner-img.jpg" alt="Hospital" style="width:100%;height:250px;object-fit:cover;border-radius:16px"/></div>
{% endif %}
</div></div></section>
<footer style="padding:40px 0;border-top:1px solid var(--bd)"><div class="container text-center" style="color:var(--tx3);font-size:.75rem">© 2026 Hamro Hospital</div></footer>
</div><script src="/static/js/jquery-3.7.1.min.js"></script><script src="/static/js/bootstrap.bundle.min.js"></script><script src="/static/js/aos.js"></script><script>AOS.init({duration:800,once:true});</script>
    <script src="/static/js/website-theme.js"></script>
</body></html>
