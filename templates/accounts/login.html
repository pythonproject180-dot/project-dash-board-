<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Hamro Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplebar@6/dist/simplebar.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css"/>
    <link rel="stylesheet" href="/static/css/theme.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon/favicon-32x32.png"/>
    <script src="/static/js/vendors/color-modes.js"></script>
</head>
<body>
    <main class="d-flex flex-column justify-content-center vh-100">
        <section>
            <div class="container">
                <div class="row mb-8">
                    <div class="col-xl-4 offset-xl-4 col-md-12 col-12">
                        <div class="text-center">
                            <a href="/" class="fs-2 fw-bold d-flex align-items-center gap-2 justify-content-center mb-6">
                                <img src="/static/images/brand/logo/hamro-hospital-logo.jpg" alt="Hamro Hospital" style="height:56px;border-radius:10px"/>
                                <span style="font-size:1.4rem">Hamro Hospital</span>
                            </a>
                            <h1 class="mb-1">Welcome Back</h1>
                            <p class="mb-0">Sign in to your staff account</p>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8 col-12">
                        <div class="card card-lg mb-6">
                            <div class="card-body p-6">
                                {% if error %}
                                <div class="alert alert-danger">{{ error }}</div>
                                {% endif %}
                                <form method="post" class="needs-validation mb-6">
                                    {% csrf_token %}
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="username" name="username" required/>
                                        <div class="invalid-feedback">Please enter username.</div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <div class="password-field position-relative">
                                            <input type="password" class="form-control fakePassword" id="password" name="password" required/>
                                            <span><i class="ti ti-eye-off passwordToggler"></i></span>
                                        </div>
                                    </div>
                                    <div class="mb-4 d-flex align-items-center justify-content-between">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="rememberMe"/>
                                            <label class="form-check-label" for="rememberMe">Remember me</label>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button class="btn btn-primary" type="submit">Sign In</button>
                                    </div>
                                </form>
                                <p style="color:var(--tx2);font-size:.85rem;text-align:center;margin-top:16px">
                                    <a href="/" style="color:var(--pur)">← Back to Public Website</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="/static/js/vendors/password.js"></script>
</body>
</html>
